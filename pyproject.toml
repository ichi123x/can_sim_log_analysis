[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "can_log_analysis"
version = "0.1.0"
description = "MFC 版 CAN バスシミュレータのフレームログを解析する（受信完了時間・送信待ち時間・送信ジッタ・CAN バス負荷）"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.8"]
dev = ["pytest", "pytest-qt>=4.5", "pytest-timeout", "PySide6>=6.8"]

[project.scripts]
can-log-analysis = "can_log_analysis.cli:main"

[project.gui-scripts]
can-log-analysis-gui = "can_log_analysis_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["perf: 300 万行の性能テスト"]
addopts = "-m 'not perf'"
timeout = 120  # a hung GUI test (e.g. a modal dialog or a thread deadlock) fails instead of blocking
